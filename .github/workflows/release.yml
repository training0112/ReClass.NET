name: release

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          tag=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | head -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Ensure tag is present
        if: steps.tag.outputs.tag == ''
        run: |
          echo "No tag found for ${{ github.event.workflow_run.head_sha }}. Skipping release."
          exit 0

      - name: Download release artifact
        if: steps.tag.outputs.tag != ''
        uses: dawidd6/action-download-artifact@v3
        with:
          name: reclass-release
          run_id: ${{ github.event.workflow_run.id }}
          path: .

      - name: Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            ReClass.NET-${{ steps.tag.outputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
